name: foc

include:
  - path: user-service/compose.yaml
    # Interpolate ${...} from the root .env. Without this, an included file reads the .env
    # next to itself (user-service/.env), which does not exist. Compose has no optional form
    # here, so the root .env must exist: `cp .env.example .env` first.
    env_file: .env
