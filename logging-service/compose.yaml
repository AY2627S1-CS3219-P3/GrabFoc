#
# The Logging Service and the database only it uses (root AGENTS.md §3). The root compose.yaml
# includes this file.
#
# Run the whole project from the repo root:   docker compose up --build
# Run only this service, from the root:       docker compose -f logging-service/compose.yaml --env-file .env up --build
# Just its database, for the integration tests: docker compose -f logging-service/compose.yaml up -d logging-db
#
# Ingest reads logging.lines from the shared broker. The query API runs either way: a broker that
# cannot be reached is logged and ingest stays off, rather than taking the service down.

# The same project name as the root file, so a standalone run reuses the same containers and
# named volumes — and so the same database.
name: foc

services:
  logging-db:
    image: postgres:17-alpine
    # Long-running, so the same policy every other service's compose file uses. Without it a
    # transient failure - or a Docker daemon restart - leaves the store stopped, and the lines it
    # exists to collect are the record of whatever went wrong (PR #129 review).
    restart: unless-stopped
    environment:
      # Supplied by the git-ignored .env so no working credential lives in the repository.
      POSTGRES_USER: foc
      # Its own password, separate from every other service's.
      # Compose cannot percent-encode, and the service's connection string embeds this value,
      # so keep it URL-safe: no @ : / ? # [ ] or %. src/config.ts rejects a URL that is outright
      # invalid, but a password with an @ parses and fails later at the driver instead.
      POSTGRES_PASSWORD: ${LOGGING_POSTGRES_PASSWORD:-change-me-in-dotenv}
      POSTGRES_DB: logging
    ports:
      # 5437 on the host: user-db has 5432, supplier-db 5434, credit-db 5435, and 5436 went
      # to notification-db (#161). Inside the container it is still the standard 5432, which
      # is what LOGGING_DATABASE_URL above points at.
      - "5437:5432"
    volumes:
      # Named volume, so the data survives `docker compose down` (root AGENTS.md §8).
      - logging-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foc -d logging"]
      interval: 5s
      timeout: 3s
      retries: 10

  logging-service:
    build:
      context: ..
      dockerfile: logging-service/Dockerfile
    # As above. This one matters most on a startup or schema failure that reaches process.exit(1):
    # without a policy the container stays down and nothing consumes the topic.
    restart: unless-stopped
    depends_on:
      logging-db:
        condition: service_healthy
    # No env_file: passing the whole .env would hand this container other services' secrets.
    # Only the variables below reach it.
    environment:
      LOGGING_PORT: 3006
      LOGGING_DATABASE_URL: postgres://foc:${LOGGING_POSTGRES_PASSWORD:-change-me-in-dotenv}@logging-db:5432/logging
      # Overridable, unlike the other services' copies of this line. They all have a dev-auth
      # fallback; this one deliberately does not, so on the standalone run in README.md the
      # `user-service` hostname does not exist on the project network and every `GET /logs`
      # answers 503 on its first JWKS fetch - with no way round it. Point it at a reachable
      # User Service (`http://host.docker.internal:3001/...`) for that run (PR #129 review).
      LOGGING_JWKS_URL: ${LOGGING_JWKS_URL:-http://user-service:3001/.well-known/jwks.json}
      # The shared broker (infra/kafka). Set directly rather than interpolated: Compose's
      # ${VAR:-default} falls back when the variable is unset *or empty*, and .env.example ships
      # every variable empty, so an empty value could never have turned ingest off the way an
      # earlier version of this comment claimed. To run the query API alone, run the service
      # outside Compose with LOGGING_KAFKA_BROKERS unset.
      LOGGING_KAFKA_BROKERS: kafka:9092
      LOGGING_KAFKA_TOPIC: ${LOGGING_KAFKA_TOPIC:-logging.lines}
      LOGGING_KAFKA_GROUP_ID: ${LOGGING_KAFKA_GROUP_ID:-logging-service}
      LOGGING_KAFKA_DLT_TOPIC: ${LOGGING_KAFKA_DLT_TOPIC:-logging.lines.dlt}
      LOGGING_RETENTION_DAYS: ${LOGGING_RETENTION_DAYS:-30}
      LOGGING_PURGE_INTERVAL_MINUTES: ${LOGGING_PURGE_INTERVAL_MINUTES:-60}
      # Optional; checked only when set in .env.
      LOGGING_JWT_ISSUER: ${LOGGING_JWT_ISSUER:-}
      LOGGING_JWT_AUDIENCE: ${LOGGING_JWT_AUDIENCE:-}
    ports:
      # 3007 on the host, 3006 inside. Every other service in the repo maps a port to
      # itself; this one does not, because the Notification Service (#161) publishes 3006
      # and two containers cannot bind the same host port - `docker compose up` fails
      # outright with "port is already allocated", and CI never sees it because it tests
      # each service alone. The container port is unchanged, so LOGGING_PORT, EXPOSE and the
      # deployed task definition are untouched; only what you type into a browser on your
      # own machine moves.
      # Host ports so far: user 3001, supplier 3002, gateway 3003, credit 3004, order 3005,
      # notification 3006, logging 3007.
      - "3007:3006"

volumes:
  logging-db-data:
