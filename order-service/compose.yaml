name: foc
services:
  order-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${ORDER_DB_NAME:-orders}
      POSTGRES_USER: ${ORDER_DB_USER:-foc}
      POSTGRES_PASSWORD: ${ORDER_DB_PASSWORD:-change-me-in-dotenv}
    volumes:
      - order-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
  order-migrate:
    build: .
    depends_on:
      order-db:
        condition: service_healthy
    environment:
      ORDER_DB_HOST: order-db
      ORDER_DB_PORT: 5432
      ORDER_DB_NAME: ${ORDER_DB_NAME:-orders}
      ORDER_DB_USER: ${ORDER_DB_USER:-foc}
      ORDER_DB_PASSWORD: ${ORDER_DB_PASSWORD:-change-me-in-dotenv}
    restart: "no"
volumes:
  order-db-data:
