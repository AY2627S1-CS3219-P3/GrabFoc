name: foc
services:
  order-db:
    # Restarted after a crash or a Docker restart; `docker compose stop` still stops it.
    restart: unless-stopped
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${ORDER_DB_NAME:-orders}
      POSTGRES_USER: ${ORDER_DB_USER:-foc}
      POSTGRES_PASSWORD: ${ORDER_DB_PASSWORD:-change-me-in-dotenv}
    volumes:
      - order-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
  order-migrate:
    build: .
    command: ["node", "dist/db/migrate-cli.js"]
    depends_on:
      order-db:
        condition: service_healthy
    environment:
      ORDER_DB_HOST: order-db
      ORDER_DB_PORT: 5432
      ORDER_DB_NAME: ${ORDER_DB_NAME:-orders}
      ORDER_DB_USER: ${ORDER_DB_USER:-foc}
      ORDER_DB_PASSWORD: ${ORDER_DB_PASSWORD:-change-me-in-dotenv}
    restart: "no"
  order-service:
    restart: unless-stopped
    build: .
    depends_on:
      order-migrate:
        condition: service_completed_successfully
      # credit.commands and order.events must exist before Order sends to them; no service creates topics. kafka-init
      # lives in infra/kafka/compose.yaml, so without the root compose file pass both:
      #   docker compose -f infra/kafka/compose.yaml -f order-service/compose.yaml up order-service
      kafka-init:
        condition: service_completed_successfully
    environment:
      ORDER_PORT: 3005
      ORDER_DB_HOST: order-db
      ORDER_DB_PORT: 5432
      ORDER_DB_NAME: ${ORDER_DB_NAME:-orders}
      ORDER_DB_USER: ${ORDER_DB_USER:-foc}
      ORDER_DB_PASSWORD: ${ORDER_DB_PASSWORD:-change-me-in-dotenv}
      ORDER_JWKS_URL: http://user-service:3001/.well-known/jwks.json
      ORDER_SUPPLIER_URL: http://supplier-service:3002
      ORDER_CREDIT_URL: http://credit-service:3004
      # Must equal the Credit Service's CREDIT_SERVICE_KEY; set it in the root .env.
      ORDER_CREDIT_SERVICE_KEY: ${CREDIT_SERVICE_KEY:-}
      ORDER_KAFKA_BROKERS: kafka:9092
      # Other services send this to Order's /internal routes; set it in the root .env.
      ORDER_SERVICE_KEY: ${ORDER_SERVICE_KEY:-}
    ports:
      - "3005:3005"
volumes:
  order-db-data:
