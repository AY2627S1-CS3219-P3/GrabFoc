name: SoCLaaS PR Review

'on':
  workflow_dispatch:
    inputs:
      mode:
        description: Check the connection or review a PR
        type: choice
        options: [check, review]
        default: check
        required: true
      pr_number:
        description: PR number (only needed for review mode)
        type: string
        required: false
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions: {}

concurrency:
  group: soclaas-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number || github.run_id }}
  cancel-in-progress: false

jobs:
  review:
    # Coarse comment filter; the Python gate trims whitespace, checks the exact
    # command, and verifies write permission before the SoCLaaS step can run.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request_target' && vars.SOCLAAS_AUTO_REVIEW == 'true') ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '/soc-review'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Load the reviewer from the trusted default branch
        env:
          GH_TOKEN: ${{ github.token }}
          TRUSTED_REF: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          # Download only this script. Never check out or execute PR code.
          python3 -I - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path
          import re
          from urllib.parse import quote
          from urllib.request import HTTPRedirectHandler, Request, build_opener

          class NoRedirects(HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          repo = os.environ['GITHUB_REPOSITORY']
          ref = os.environ['TRUSTED_REF']
          if not ref or not re.fullmatch(r'[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+', repo):
              raise SystemExit('Missing trusted default branch or invalid repository.')
          url = ('https://api.github.com/repos/' + repo
                 + '/contents/.github/scripts/soclaas_review.py?ref=' + quote(ref, safe=''))
          request = Request(url, headers={
              'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'soclaas-review-bootstrap'})
          try:
              with build_opener(NoRedirects()).open(request, timeout=30) as response:
                  raw = response.read(300001)
              if len(raw) > 300000:
                  raise ValueError('Script response too large')
              source = json.loads(raw)
              if source.get('encoding') != 'base64' or source.get('type') != 'file':
                  raise ValueError('Expected a file')
              script = base64.b64decode(source['content'])
              Path(os.environ['RUNNER_TEMP'], 'soclaas_review.py').write_bytes(script)
          except Exception:
              raise SystemExit('Cannot load the reviewer. Confirm both setup files are on the default branch and Actions has contents: read permission.')
          PY

      - name: Verify the requester's repository permission
        id: gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOCLAAS_AUTO_REVIEW: ${{ vars.SOCLAAS_AUTO_REVIEW }}
        run: python3 -I "$RUNNER_TEMP/soclaas_review.py" gate

      - name: Check SoCLaaS or review the PR
        if: steps.gate.outputs.run == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOCLAAS_API_KEY: ${{ secrets.SOCLAAS_API_KEY }}
          SOCLAAS_MODEL: ${{ vars.SOCLAAS_MODEL }}
          SOCLAAS_BASE_URL: ${{ vars.SOCLAAS_BASE_URL || 'https://soclaas-api.comp.nus.edu.sg/v1' }}
          REVIEW_MODE: ${{ steps.gate.outputs.mode }}
          PR_NUMBER: ${{ steps.gate.outputs.pr_number }}
        run: python3 -I "$RUNNER_TEMP/soclaas_review.py" run
