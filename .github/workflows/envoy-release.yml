# AI Assistance Disclosure:
# Tool: Codex (model: GPT-6), date: 2026-10-13
# Scope: Separate native compilation/testing and optional GHCR publication from app builds.
# Author review: User approved workflow separation; generated changes review pending.
# AI-generated; release runs are explicitly dispatched, never ordinary app pushes.
name: Custom Envoy release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: New immutable native image version (do not overwrite existing tags)
        required: true
        default: v1.38.6-foc.1
        type: string
      publish:
        description: Publish the verified image to GHCR
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

concurrency:
  group: envoy-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REGISTRY_USER: ${{ github.actor }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate version and authenticate
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v1\.38\.6-foc\.[0-9]+$ ]] || { echo 'Invalid release tag'; exit 1; }
          IMAGE="ghcr.io/${REPOSITORY,,}-envoy"
          echo "ENVOY_RELEASE_IMAGE=$IMAGE:$RELEASE_TAG" >> "$GITHUB_ENV"
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin
          if docker manifest inspect "$IMAGE:$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'Release tag already exists; choose a new version.'
            exit 1
          fi
      - name: Compile and run native regressions
        run: docker build -f api-gateway/Dockerfile.envoy-release -t "$ENVOY_RELEASE_IMAGE" api-gateway
      - name: Package gateway configuration
        run: docker build -f api-gateway/Dockerfile.envoy --build-arg "FOC_ENVOY_BASE_IMAGE=$ENVOY_RELEASE_IMAGE" -t foc-envoy:local api-gateway
      - name: Test HTTP compatibility and load balancing
        working-directory: api-gateway
        run: |
          npm ci
          npm run build
          node --test --test-concurrency=1 test/envoy.integration.mjs
      - name: Publish verified base image
        if: ${{ inputs.publish }}
        run: |
          docker push "$ENVOY_RELEASE_IMAGE"
          echo "Published $ENVOY_RELEASE_IMAGE" >> "$GITHUB_STEP_SUMMARY"
          docker inspect "$ENVOY_RELEASE_IMAGE" --format '{{json .RepoDigests}}' >> "$GITHUB_STEP_SUMMARY"
