name: Deploy production

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to roll back to. Leave empty for the tag staging last passed."
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # AI-generated (Claude Code, 2026-11-06): above deploy-images.sh at its slowest, about
    # 132 min (per layer up to 3 x 10 min stable waits, per service up to 20 x 15 s health checks).
    timeout-minutes: 150
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::690084476135:role/foc-github-deploy-production
          aws-region: ap-southeast-1
      - name: Choose the tag
        id: tag
        env:
          ROLLBACK_TAG: ${{ inputs.tag }}
        run: |
          tag="$ROLLBACK_TAG"
          if [ -z "$tag" ]; then
            tag=$(aws ssm get-parameter --name /foc-deploy/staging/passed-tag --query Parameter.Value --output text)
          fi
          if ! [[ "$tag" =~ ^[0-9a-f]{7}$ ]]; then
            echo "not an image tag: $tag" >&2
            exit 1
          fi
          # deploy-images.sh checks that every image exists on the tag before it changes anything.
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Roll it onto production
        run: infra/scripts/deploy-images.sh production "${{ steps.tag.outputs.tag }}"
