name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Node versions follow each service's Dockerfile.
          - service: user-service
            node: 24
          - service: supplier-service
            node: 22
          - service: credit-service
            node: 22
          # added for logging service
          - service: logging-service
            node: 22
          - service: notification-service
            node: 22
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: ${{ matrix.service }}/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build

  # The Credit Service's important guarantees (no overdraw, idempotent repeats, concurrent
  # requests) are checked by its integration tests, so they run here against a real PostgreSQL.
  credit-integration:
    name: Integration tests (credit-service)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: foc
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U foc"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: credit-service
    env:
      # The tests create this database themselves; its name must end in _test.
      CREDIT_TEST_DATABASE_URL: postgres://foc:ci-only-password@localhost:5432/credit_test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: credit-service/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Integration tests
        run: npm run test:int

  # The Logging Service's store is where its pagination, filtering and retention rules actually
  # live - they are SQL, so unit tests cannot reach them. Added because a pagination fix of mine
  # could not be run locally (no Docker on that machine) and nothing in CI would have caught it
  # (PR #129 review).
  logging-integration:
    name: Integration tests (logging-service)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: foc
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U foc"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: logging-service
    env:
      # The tests create this database themselves; its name must end in _test.
      LOGGING_TEST_DATABASE_URL: postgres://foc:ci-only-password@localhost:5432/logging_test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: logging-service/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Integration tests
        run: npm run test:int

  # Notification's guarantees (one email per event, no stale or out-of-sequence emails, retries and
  # dead letters) live in its integration and Kafka tests, so they run against real services.
  notification-integration:
    name: Integration and Kafka tests (notification-service)
    runs-on: ubuntu-latest
    # The Kafka tests take under a minute; stop a hung run instead of waiting 6 hours.
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: foc
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U foc"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      # The same image as infra/kafka, as a single broker that is also its own controller. Topic
      # auto-creation is off, as in Compose: the tests create their own prefixed topics.
      kafka:
        image: apache/kafka:4.1.0
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:9092
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@127.0.0.1:9093
          KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
          KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
        ports:
          - 9092:9092
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server 127.0.0.1:9092"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 20
    defaults:
      run:
        working-directory: notification-service
    env:
      # The tests create this database themselves; its name must end in _test.
      NOTIFICATION_TEST_DATABASE_URL: postgres://foc:ci-only-password@127.0.0.1:5432/notification_test
      NOTIFICATION_TEST_KAFKA_BROKERS: 127.0.0.1:9092
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: notification-service/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Integration tests
        run: npm run test:int
      - name: Kafka tests
        run: npm run test:kafka

  frontend:
    name: Lint and build (frontend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
