name: Deploy staging

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

# One at a time, and never cancelled: a cancelled deploy would leave services half rolled.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    # The deploy role trusts only main.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # AI-generated (Claude Code, 2026-11-06): above the three scripts at their slowest,
    # about 187 min: push ~20, deploy-images.sh ~132, run-checks.sh 3 x 10 min waits plus logs.
    timeout-minutes: 210
    steps:
      - uses: actions/checkout@v7
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::690084476135:role/foc-github-deploy-staging
          aws-region: ap-southeast-1
      - name: Image tag
        id: tag
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Build and push the images
        run: infra/scripts/push-images.sh "${{ steps.tag.outputs.tag }}"
      - name: Roll them onto staging
        run: infra/scripts/deploy-images.sh staging "${{ steps.tag.outputs.tag }}"
      - name: Run the checks
        run: infra/scripts/run-checks.sh staging "${{ steps.tag.outputs.tag }}"
