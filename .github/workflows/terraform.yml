name: Terraform

on:
  pull_request:
    paths:
      - "infra/terraform/**"
      - "infra/scripts/**"
      - "infra/checks/**"
      - "api-gateway/postman/**" # a renamed folder would fail the checks image
      - ".github/workflows/terraform.yml"

permissions:
  contents: read

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "~1.15.0"
          terraform_wrapper: false
      - name: fmt, validate and test every stack and module
        run: infra/terraform/check.sh
      - name: test the deployment scripts
        run: |
          infra/scripts/test/put-secrets.test.sh
          infra/scripts/test/new-secrets.test.sh
          infra/scripts/test/push-images.test.sh
          # AI-generated (Claude Code).
          infra/scripts/test/deploy-images.test.sh
          infra/scripts/test/run-checks.test.sh
          infra/scripts/test/repo-checks.test.sh
      - name: test the checks selection
        run: node --test infra/checks/test/select.test.mjs

  plan:
    needs: check
    # Fork pull requests get no OIDC token.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: infra/terraform/envs/staging
        shell: bash # with pipefail, so a failed plan isn't hidden by sed
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "~1.15.0"
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::690084476135:role/foc-github-plan
          aws-region: ap-southeast-1
      - run: terraform init -input=false -backend-config="bucket=foc-terraform-state-690084476135"
      # The plan shows single addresses from those lists, which the secret masking doesn't cover.
      - name: terraform plan
        # Secrets, not variables: GitHub prints env in this public log and masks only secrets.
        # Set on this step alone, so the setup and sign-in steps above never see them.
        # AI-generated (Claude Code, 2026-11-09): moved from the job's env (security review of #191).
        env:
          TF_VAR_alert_emails: ${{ secrets.TF_VAR_alert_emails }}
          TF_VAR_mailpit_relay_to: ${{ secrets.TF_VAR_mailpit_relay_to }}
        run: |
          terraform plan -input=false -no-color -lock=false -var-file=staging.tfvars 2>&1 |
            sed -E 's/[A-Za-z0-9._%+\\-]+@[A-Za-z0-9\\.-]+/<email>/g'
