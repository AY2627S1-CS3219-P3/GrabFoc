# Terraform and deployment-script checks on pull requests that touch the infrastructure (issue #100). "terraform plan"
# against AWS is added with the deploy workflows (part 3, #143), once the OIDC roles exist.

name: Terraform

on:
  pull_request:
    paths:
      - "infra/terraform/**"
      - "infra/scripts/**"
      - ".github/workflows/terraform.yml"

permissions:
  contents: read

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.15.0"
          terraform_wrapper: false
      - name: fmt, validate and test every stack and module
        run: infra/terraform/check.sh
      - name: test the deployment scripts
        run: infra/scripts/test/put-secrets.test.sh
