# AI Assistance Disclosure:
# Tool: Codex (model: GPT-6), date: 2026-09-28
# Scope: Generated CodeQL scans for pull requests targeting any branch, main pushes, and weekly scans.
# Author review (Jian Bing): Initial setup approved in PR #23; the any-branch coverage was approved by
#   Jyang1206 and merged in PR #27. CodeQL has since run on PRs #30, #33 and #36. Not yet seen on a
#   PR that targets a branch other than main.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
