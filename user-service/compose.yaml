#
# The User Service and the containers only it uses. Its database is its own — no other
# service connects to user-db (root AGENTS.md §3). The root compose.yaml includes this file.
#
# Run the whole project from the repo root:   docker compose up --build
# Run only the User Service, from the root:   docker compose -f user-service/compose.yaml --env-file .env up --build
#
# Mailpit's web inbox is on http://localhost:8025 — sign-up and password OTPs arrive there.
# It lives here because only this service sends email today; move it to the root compose.yaml
# once a second service needs it, since two included files cannot both define it.

# The same project name as the root file, so a standalone run reuses the same containers and
# named volumes — and so the same database.
name: foc

services:
  user-db:
    image: postgres:17-alpine
    environment:
      # Supplied by the git-ignored .env so no working credential lives in the repository.
      # The fallback keeps `docker compose up` working on a fresh clone; override it in .env.
      POSTGRES_USER: foc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-in-dotenv}
      POSTGRES_DB: users
    ports:
      - "5432:5432"
    volumes:
      # Named volume, so the data survives `docker compose down` (root AGENTS.md §8).
      - user-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foc -d users"]
      interval: 5s
      timeout: 3s
      retries: 10

  user-redis:
    image: redis:7-alpine
    # AOF with everysec: at most one second of OTPs and counters is lost on a crash.
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "6379:6379"
    volumes:
      - user-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    # A fake SMTP server with a web inbox, so OTP emails can be read without sending real mail.
    # Pinned: this container is part of the demo, so it must not change under us.
    image: axllent/mailpit:v1.31.2
    ports:
      - "1025:1025"   # SMTP, what the service sends to
      - "8025:8025"   # web inbox, what you open in a browser
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10

  user-service:
    build: .
    depends_on:
      user-db:
        condition: service_healthy
      user-redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    # Only the variables this service reads (src/config/env.validation.ts), taken from the git-ignored .env at the
    # repo root. No env_file: passing the whole .env would hand this container every other
    # service's secrets too, such as SUPPLIER_POSTGRES_PASSWORD. A variable left empty is treated as
    # unset (src/config/env.validation.ts), so a missing secret still fails at startup naming it.
    environment:
      # These point at the containers above, because inside the compose network the hostnames
      # are the service names, not localhost.
      USER_PORT: 3001
      USER_DATABASE_URL: postgres://foc:${POSTGRES_PASSWORD:-change-me-in-dotenv}@user-db:5432/users
      USER_REDIS_URL: redis://user-redis:6379
      USER_SMTP_HOST: mailpit
      USER_SMTP_PORT: 1025
      # Asked before a deactivation; until order-service runs, deactivation answers 503.
      USER_ORDER_URL: http://order-service:3005
      # Must equal the Order Service's ORDER_SERVICE_KEY; set it in the root .env.
      USER_ORDER_SERVICE_KEY: ${ORDER_SERVICE_KEY:-}
      # From .env.
      LOG_LEVEL: ${LOG_LEVEL:-}
      USER_AES_KEY: ${USER_AES_KEY:-}
      USER_EMAIL_HMAC_KEY: ${USER_EMAIL_HMAC_KEY:-}
      USER_OTP_HMAC_KEY: ${USER_OTP_HMAC_KEY:-}
      USER_JWT_PRIVATE_KEY: ${USER_JWT_PRIVATE_KEY:-}
      USER_JWT_KID: ${USER_JWT_KID:-}
      USER_SMTP_USER: ${USER_SMTP_USER:-}
      USER_SMTP_PASS: ${USER_SMTP_PASS:-}
      USER_SMTP_FROM: ${USER_SMTP_FROM:-}
      USER_BOOTSTRAP_ADMIN_EMAIL: ${USER_BOOTSTRAP_ADMIN_EMAIL:-}
      # The outbox relay publishes UserRegistered to the shared broker (infra/kafka). There is
      # deliberately no depends_on on kafka or kafka-init: the service must start and accept
      # sign-ups with Kafka down, and the relay keeps retrying until the broker and topic exist.
      USER_KAFKA_BROKERS: kafka:9092
      USER_OUTBOX_POLL_MS: ${USER_OUTBOX_POLL_MS:-}
      USER_OUTBOX_MAX_BACKOFF_MS: ${USER_OUTBOX_MAX_BACKOFF_MS:-}
    ports:
      - "3001:3001"

volumes:
  user-db-data:
  user-redis-data:
