name: foc

services:
  frontend:
    # Restarted after a crash or a Docker restart; `docker compose stop` still stops it.
    restart: unless-stopped
    build:
      context: .
      args:
        FRONTEND_GATEWAY_URL: http://api-gateway:3003
    environment:
      FRONTEND_GATEWAY_URL: http://api-gateway:3003
    ports:
      - "3000:3000"
