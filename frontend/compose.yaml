name: foc

services:
  frontend:
    # Restarted after a crash or a Docker restart; `docker compose stop` still stops it.
    restart: unless-stopped
    build:
      context: .
      args:
        FRONTEND_GATEWAY_URL: http://api-gateway:3003
    environment:
      FRONTEND_GATEWAY_URL: http://api-gateway:3003
      # The browser opens the chat socket itself, so this is a host address (Envoy), not a
      # container name. Read at request time by app/orders/[id]/page.tsx (the chat plan).
      CHAT_SOCKET_URL: ${CHAT_SOCKET_URL:-http://localhost:3003}
      CHAT_SOCKET_PATH: ${CHAT_SOCKET_PATH:-/gateway/socket.io/}
    ports:
      - "3000:3000"
