name: foc

services:
  api-gateway:
    # AI-generated; official precompiled Envoy, no custom native build.
    image: foc-envoy:local
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      GATEWAY_PORT: 3003
      GATEWAY_LB_POLICY: ${GATEWAY_LB_POLICY:-ROUND_ROBIN}
      GATEWAY_CONNECT_TIMEOUT: ${GATEWAY_CONNECT_TIMEOUT:-3s}
      GATEWAY_ROUTE_TIMEOUT: ${GATEWAY_ROUTE_TIMEOUT:-0s}
      GATEWAY_ROUTE_IDLE_TIMEOUT: ${GATEWAY_ROUTE_IDLE_TIMEOUT:-10s}
      GATEWAY_JWKS_FETCH_TIMEOUT: ${GATEWAY_JWKS_FETCH_TIMEOUT:-3s}
      GATEWAY_JWKS_CACHE_DURATION: ${GATEWAY_JWKS_CACHE_DURATION:-60s}
      GATEWAY_WORKERS: ${GATEWAY_WORKERS:-2}
      USER_SERVICE_URL: ${USER_SERVICE_URL:-http://user-service:3001}
      SUPPLIER_SERVICE_URL: ${SUPPLIER_SERVICE_URL:-http://supplier-service:3002}
      # Credit routes in 40-credit.routes.json (balance and history only).
      CREDIT_SERVICE_URL: ${CREDIT_SERVICE_URL:-http://credit-service:3004}
      USER_SERVICE_JWKS_URL: ${USER_SERVICE_JWKS_URL:-}
      GATEWAY_AUTH_PREFIX: ${GATEWAY_AUTH_PREFIX:-/auth}
      GATEWAY_LOCATIONS_PREFIX: ${GATEWAY_LOCATIONS_PREFIX:-/locations}
      GATEWAY_CREDITS_PREFIX: ${GATEWAY_CREDITS_PREFIX:-/credits}
      GATEWAY_JWT_ISSUER: ${GATEWAY_JWT_ISSUER:-}
      GATEWAY_JWT_AUDIENCE: ${GATEWAY_JWT_AUDIENCE:-}
      FOC_TEST_SUPPLIER_URLS: ${FOC_TEST_SUPPLIER_URLS:-}
    ports:
      - "3003:3003"
